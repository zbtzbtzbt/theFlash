name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A release waits for a finished green run on main, so a run on main is
# never cancelled by the next push. A pull request's run is replaced by its
# next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the toolchain and its components, so CI
      # builds with what a local run uses.
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check
        shell: bash
        run: bash scripts/check.sh
