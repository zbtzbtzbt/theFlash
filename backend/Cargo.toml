[package]
name = "theflash"
version = "0.1.0-rc.1"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# `kill(pid, 0)`: the merge lock only takes over a lock whose holder is
# gone (backend/src/merge_gate/lock.rs). Already in the tree through tokio,
# so this adds no crate to the build.
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
